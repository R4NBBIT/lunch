<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="점심 메뉴·맛집 뽑기">
<title>점메추</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one narrow column — tab switch, a big "today's pick" plate, then the shared list you edit together. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E8ECE4; --fg:#1E2722; --muted:#5E6A63; --line:#D5DCD2;
  --yolk:#F2B705; --yolk-ink:#3A2C00; --yolk-soft:#FFF1C2; --danger:#C2412D; --ok:#2F7A4F;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151A17; --surface:#1E2521; --sunk:#262E29; --fg:#ECF0EA; --muted:#9AA69F; --line:#323B35;
  --yolk:#F5C230; --yolk-ink:#2A2000; --yolk-soft:#3A3115; --danger:#EF7A66; --ok:#6CC28F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151A17; --surface:#1E2521; --sunk:#262E29; --fg:#ECF0EA; --muted:#9AA69F; --line:#323B35;
  --yolk:#F5C230; --yolk-ink:#2A2000; --yolk-soft:#3A3115; --danger:#EF7A66; --ok:#6CC28F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:10px}
.egg{width:34px;height:40px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:999px;padding:4px}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.plate .label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.pick{font-family:var(--display);font-size:clamp(30px,9vw,44px);line-height:1.15;margin:0;text-wrap:balance;min-height:1.2em;word-break:keep-all}
.pick.idle{color:var(--muted);font-size:22px}
.meta{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-height:0}
.meta a{color:var(--fg);font-weight:500}
.chip{display:inline-block;background:var(--yolk-soft);color:var(--fg);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.main{background:var(--yolk);color:var(--yolk-ink);border-color:transparent;font-size:17px;padding:14px 28px}
.btn.small{padding:8px 12px;font-size:13px;font-weight:500}
.btn.danger{color:var(--danger)}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,.x:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:12.5px;color:var(--muted);margin:0}
.admin{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.linkbtn{font:inherit;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.linkbtn:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.admin code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:12px;word-break:break-all}
.toast{font-size:13px;color:var(--ok);min-height:1.3em;margin:0}
section.list{display:flex;flex-direction:column;gap:12px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
form.add{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
form.add input[name="name"]{flex:2 1 160px}
form.add .opt{flex:1 1 110px}
.searchrow{display:flex;gap:8px;width:100%}
.searchrow input{flex:1 1 auto}
.results{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.results li+li{border-top:1px solid var(--line)}
.results button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:10px 12px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--yolk-soft)}
.results .rn{font-weight:700;min-width:0}
.results .rd{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.results .ra{grid-column:1 / -1;color:var(--muted);font-size:12.5px}
.results .rmsg{padding:10px 12px;color:var(--muted);font-size:13.5px}
.hint{width:100%;font-size:12.5px;color:var(--muted);margin:0}
.filter{width:100%}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
ul.items li{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:14px}
ul.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
ul.places li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 8px 10px 14px;border-top:1px solid var(--line);align-items:center}
ul.places li:first-child{border-top:0}
ul.places li.off{opacity:.55}
.pname{font-weight:700;min-width:0}
.pname a{color:inherit;text-decoration:none}
.pname a:hover{text-decoration:underline}
.pinfo{grid-column:1;font-size:12.5px;color:var(--muted);min-width:0}
.x{grid-row:1 / span 2;grid-column:2;font:inherit;border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
ul.items .x{width:26px;height:26px;font-size:15px}
.x:hover{background:var(--sunk);color:var(--danger)}
.reset{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding-top:4px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--yolk-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
@media (prefers-reduced-motion: no-preference){.pick.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:none;opacity:1}}}
</style>

</head>

<div class="wrap">
  <header>
    <svg class="egg" viewBox="0 0 34 40" aria-hidden="true"><ellipse cx="11" cy="9" rx="5.5" ry="7.5" fill="var(--yolk)"/><rect x="9.6" y="15" width="2.8" height="23" rx="1.4" fill="var(--yolk)"/><rect x="20" y="2" width="2.6" height="36" rx="1.3" fill="var(--fg)" transform="rotate(-4 21 20)"/><rect x="26" y="2" width="2.6" height="36" rx="1.3" fill="var(--fg)" transform="rotate(4 27 20)"/></svg>
    <div>
      <h1>점메추</h1>
      <p class="sub">오늘 점심 고민 해결소 · 목록은 같이 고쳐요</p>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-menu" aria-selected="true" data-tab="menu">메뉴 추천</button>
    <button role="tab" id="tab-place" aria-selected="false" data-tab="place">맛집 추천</button>
  </div>

  <div class="plate" aria-live="polite">
    <span class="label" id="plateLabel">오늘의 메뉴는</span>
    <p class="pick idle" id="pick">버튼을 눌러 뽑아보세요</p>
    <div class="meta" id="meta"></div>
    <div class="row">
      <button class="btn main" id="draw">🍽️ 뽑기</button>
      <button class="btn" id="copy" disabled>복사</button>
    </div>
    <p class="note" id="offNote" hidden></p>
    <p class="toast" id="toast"></p>
  </div>

  <section class="list" id="menuSec">
    <div class="list-head"><h2>메뉴판</h2><span class="count" id="menuCount"></span></div>
    <form class="add" id="menuForm" data-edit>
      <input id="menuName" name="name" placeholder="메뉴 이름 (예: 김치볶음밥)" maxlength="40" autocomplete="off">
      <button class="btn" type="submit">추가</button>
    </form>
    <input class="filter" id="menuFilter" placeholder="메뉴 찾기" autocomplete="off">
    <ul class="items" id="menuList"></ul>
    <div class="reset" data-edit id="menuReset"></div>
  </section>

  <section class="list" id="placeSec" hidden>
    <div class="list-head"><h2>회사 근처 맛집</h2><span class="count" id="placeCount"></span></div>
    <form class="add" id="placeForm" data-edit>
      <div class="searchrow">
        <input id="placeName" name="name" placeholder="가게 이름 (예: 미돈)" maxlength="40" autocomplete="off">
        <button class="btn" type="button" id="placeSearch" disabled>추가</button>
      </div>
      <ul class="results" id="placeResults" hidden></ul>
      <p class="hint" id="placeHint">가게 이름을 넣고 검색한 뒤, 맞는 가게를 누르면 바로 추가돼요.</p>
    </form>
    <input class="filter" id="placeFilter" placeholder="가게·종류 찾기" autocomplete="off">
    <ul class="places" id="placeList"></ul>
    <div class="reset" data-edit id="placeReset"></div>
  </section>

  <p class="note" id="syncNote">목록 불러오는 중…</p>
  <div class="admin" id="adminBar"></div>
</div>

  if(t==="menu")pool=menus();
  else{const d=todayKST();pool=places().filter(p=>p.off!==d)}
  if(!pool.length){state.current=null;renderPlate("목록이 비어 있어요");return}
  let pick;const last=state.last[t];
  for(let i=0;i<8;i++){pick=pool[Math.floor(Math.random()*pool.length)];if(pool.length<2||(t==="menu"?pick!==last:pick.name!==last?.name))break}
  state.last[t]=pick;state.current=pick;renderPlate();
  const el=$("pick");el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
  $("draw").textContent="🍽️ 다시 뽑기";
}

function renderPlate(emptyMsg){
  const el=$("pick"),meta=$("meta"),c=state.current;
  $("copy").disabled=!c;
  if(!c){el.className="pick idle";el.textContent=emptyMsg||"버튼을 눌러 뽑아보세요";meta.innerHTML="";$("draw").textContent="🍽️ 뽑기";return}
  el.className="pick";
  if(state.tab==="menu"){el.textContent=c;meta.innerHTML=""}
  else{
    el.textContent=c.name;
    meta.innerHTML=`<div>${c.cat?`<span class="chip">${esc(c.cat)}</span> `:""}${c.dist?`걸어서 ${c.dist}m`:""}</div>
      <div>${esc(c.addr||"")}</div>
      <div><a href="${esc(linkOf(c))}" target="_blank" rel="noopener">카카오맵에서 보기 ↗</a></div>`;
  }
}
function renderOffNote(){
  const n=$("offNote");if(state.tab!=="place"){n.hidden=true;return}
  const d=todayKST(),off=places().filter(p=>p.off===d);
  n.hidden=!off.length;n.textContent=`오늘(${DAYS[d]}) 휴무라 빠진 곳: ${off.map(p=>p.name).join(", ")}`;
}

async function copyPick(){
  const c=state.current;if(!c)return;
  const text=state.tab==="menu"?`🍽️ 오늘 점심 메뉴: ${c}`:`🍽️ 오늘 점심은 ${c.name}!${c.cat?` (${c.cat})`:""}\n📍 ${c.addr||""}\n${linkOf(c)}`;
  try{await navigator.clipboard.writeText(text);toast("복사됐어요")}
  catch(e){const r=document.createRange();r.selectNodeContents($("plateLabel").parentElement);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("복사가 막혀 있어서 선택만 해뒀어요. 길게 눌러 복사하세요")}
}

function renderMenus(){
  const all=menus(),q=$("menuFilter").value.trim();
  const shown=q?all.filter(m=>m.includes(q)):all;
  $("menuCount").textContent=`${all.length}개${state.menus===null?" · 기본 목록":""}`;
  $("menuList").innerHTML=shown.length?shown.map(m=>`<li>${esc(m)}${state.canEdit?`<button class="x" data-del-menu="${esc(m)}" aria-label="${esc(m)} 삭제">×</button>`:""}</li>`).join(""):`<li class="empty" style="border:0;background:none">${q?"찾는 메뉴가 없어요":"메뉴가 비어 있어요. 위에서 추가해보세요"}</li>`;
  renderReset("menu");
}
function renderPlaces(){
  const all=[...places()].sort((a,b)=>(a.dist??9999)-(b.dist??9999)),q=$("placeFilter").value.trim(),d=todayKST();
  const shown=q?all.filter(p=>(p.name+" "+(p.cat||"")).includes(q)):all;
  $("placeCount").textContent=`${all.length}곳${state.places===null?" · 기본 목록":""}`;
  $("placeList").innerHTML=shown.length?shown.map(p=>{
    const off=p.off!=null&&p.off!=="";const isOff=off&&p.off===d;
    return `<li class="${isOff?"off":""}"><span class="pname"><a href="${esc(linkOf(p))}" target="_blank" rel="noopener">${esc(p.name)}</a></span>
    <span class="pinfo">${[p.cat,p.dist?p.dist+"m":"",off?DAYS[p.off]+"요일 휴무"+(isOff?" (오늘)":""):"",p.addr].filter(Boolean).map(esc).join(" · ")}</span>
    ${state.canEdit?`<button class="x" data-del-place="${esc(p.name)}" aria-label="${esc(p.name)} 삭제">×</button>`:""}</li>`}).join(""):`<li class="empty">${q?"찾는 가게가 없어요":"가게가 비어 있어요. 위에서 추가해보세요"}</li>`;
  renderReset("place");renderOffNote();
}
function renderReset(kind){
  const box=$(kind==="menu"?"menuReset":"placeReset");
  if(!state.isAdmin){box.innerHTML="";return}
  const isDefault=kind==="menu"?state.menus===null:state.places===null;
  if(state.confirming===kind){
    box.innerHTML=`<div class="confirm">${kind==="menu"?"메뉴판":"맛집 목록"}을 처음 설정으로 되돌릴까요? 추가·삭제한 내용이 모두 사라져요.
      <button class="btn small danger" data-reset-yes="${kind}">되돌리기</button><button class="btn small" data-reset-no>취소</button></div>`;
  }else box.innerHTML=`<button class="btn small" data-reset="${kind}" ${isDefault?"disabled":""}>초기화</button>`;
}
function renderAll(){renderMenus();renderPlaces();if(state.current&&state.tab==="place")renderPlate()}

// ---- shared store (Firebase Firestore) ----
const firebaseConfig={
  apiKey:"AIzaSyB9kuHlUu64elcBdzUsrydIWhj7EIpujs8",
  authDomain:"lloydk-lunch.firebaseapp.com",
  projectId:"lloydk-lunch",
  storageBucket:"lloydk-lunch.firebasestorage.app",
  messagingSenderId:"713270883032",
  appId:"1:713270883032:web:da58cb0913e33d9ca2ddad"
};
const cleanMenus=v=>Array.isArray(v)?v.filter(m=>typeof m==="string"&&m.trim()):null;
const cleanPlaces=v=>Array.isArray(v)?v.filter(p=>p&&typeof p.name==="string"&&p.name.trim()):null;
const queues={};
function save(kind,items){
  if(kind==="menu")state.menus=items;else state.places=items;
  renderAll();
  if(!state.db)return;
  const ref=state.refs[kind];
  queues[kind]=(queues[kind]||Promise.resolve()).then(()=>items===null?deleteDoc(ref):setDoc(ref,{items})).catch(e=>{
    if(e&&e.code==="permission-denied")toast(items===null?"초기화는 관리자만 할 수 있어요":"저장이 거부됐어요. 목록이 너무 길거나 형식이 맞지 않아요");
    else toast("저장하지 못했어요. 잠시 후 다시 해보세요");
  });
}
function applyEdit(){for(const el of document.querySelectorAll("[data-edit]"))el.hidden=!state.canEdit;renderAll()}

function initStore(){
  try{
    const app=initializeApp(firebaseConfig);initAuth(app);
    const db=getFirestore(app);
    state.db=db;state.refs.menu=doc(db,"lists","menus");state.refs.place=doc(db,"lists","places");
    const onErr=()=>{$("syncNote").textContent="공유 목록과 연결이 끊겼어요. 새로고침해 주세요."};
    onSnapshot(state.refs.menu,s=>{state.menus=s.exists()?cleanMenus(s.data().items):null;renderAll()},onErr);
    onSnapshot(state.refs.place,s=>{state.places=s.exists()?cleanPlaces(s.data().items):null;renderAll()},onErr);
    $("syncNote").textContent="목록은 이 링크를 연 모두가 함께 써요. 누가 고치면 바로 반영돼요.";
  }catch(e){
    $("syncNote").textContent="공유 목록에 연결하지 못해서, 고친 내용이 이 화면에만 남아요.";
  }
}

// ---- admin (only the owner can reset) ----
const OWNER_UID="1wuDcDT4LGc3uBLmBRqUkDsuxgx2";
function renderAdmin(){
  const bar=$("adminBar"),u=state.user;
  if(!state.auth){bar.innerHTML="";return}
  if(!u){bar.innerHTML=`<button class="linkbtn" id="adminIn">관리자 로그인</button>`;return}
  if(state.isAdmin){bar.innerHTML=`<span>관리자로 로그인했어요. 초기화 버튼이 보여요.</span><button class="linkbtn" id="adminOut">로그아웃</button>`;return}
  bar.innerHTML=`<span>이 계정은 관리자가 아니에요. 계정 ID: <code>${esc(u.uid)}</code></span><button class="linkbtn" id="adminCopy">ID 복사</button><button class="linkbtn" id="adminOut">로그아웃</button>`;
}
function initAuth(app){
  try{
    state.auth=getAuth(app);
    onAuthStateChanged(state.auth,u=>{state.user=u;state.isAdmin=!!u&&u.uid===OWNER_UID;state.confirming=null;renderAdmin();renderReset("menu");renderReset("place")});
  }catch(e){state.auth=null}
  renderAdmin();
}
$("adminBar").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="adminIn"){try{await signInWithPopup(state.auth,new GoogleAuthProvider())}catch(err){if(err?.code!=="auth/popup-closed-by-user"&&err?.code!=="auth/cancelled-popup-request")toast("로그인하지 못했어요. 팝업 차단을 확인해주세요")}}
  else if(t.id==="adminOut"){await signOut(state.auth);toast("로그아웃했어요")}
  else if(t.id==="adminCopy"){try{await navigator.clipboard.writeText(state.user.uid);toast("계정 ID를 복사했어요")}catch(err){toast("복사가 막혀 있어요. ID를 길게 눌러 복사하세요")}}
});

// ---- place search (Kakao Local) ----
const OFFICE_ADDR="경기 성남시 수정구 위례서일로 6";
const kk={places:null,center:null};
function initKakao(){
  const k=window.kakao;
  if(!k||!k.maps||!k.maps.load){$("placeHint").textContent="지금은 가게 검색에 연결되지 않아서 가게를 추가할 수 없어요.";return}
  k.maps.load(()=>{
    kk.places=new k.maps.services.Places();
    new k.maps.services.Geocoder().addressSearch(OFFICE_ADDR,(r,st)=>{if(st===k.maps.services.Status.OK&&r[0])kk.center=new k.maps.LatLng(r[0].y,r[0].x)});
    $("placeSearch").disabled=false;
  });
}
function hideResults(){$("placeResults").hidden=true;$("placeResults").innerHTML=""}
function catOf(c){const parts=String(c||"").split(">").map(x=>x.trim()).filter(Boolean);return parts.length>1?parts.slice(1).join(" · "):(parts[0]||"")}
let lastResults=[];
function searchPlace(){
  const q=$("placeName").value.trim(),box=$("placeResults");
  if(!q||!kk.places)return;
  box.hidden=false;box.innerHTML=`<li class="rmsg">찾는 중…</li>`;
  const k=window.kakao,S=k.maps.services;
  const opt={size:8};
  if(kk.center){opt.location=kk.center;opt.radius=3000;opt.sort=S.SortBy.DISTANCE}
  kk.places.keywordSearch(q,(data,status)=>{
    if(status===S.Status.ZERO_RESULT){box.innerHTML=`<li class="rmsg">근처에서 찾지 못했어요. 종류·주소를 직접 넣고 추가해도 돼요.</li>`;return}
    if(status!==S.Status.OK){box.innerHTML=`<li class="rmsg">검색이 안 돼요. 잠시 후 다시 해보거나 직접 입력해주세요.</li>`;return}
    lastResults=data;
    box.innerHTML=data.map((d,i)=>`<li><button type="button" data-pick="${i}"><span class="rn">${esc(d.place_name)}</span><span class="rd">${d.distance?Number(d.distance).toLocaleString()+"m":""}</span><span class="ra">${esc(catOf(d.category_name))}${d.category_name?" · ":""}${esc(d.road_address_name||d.address_name||"")}</span></button></li>`).join("");
  },opt);
}
function pickResult(i){
  const d=lastResults[i];if(!d)return;
  const name=d.place_name;
  if(places().some(p=>p.name===name||(d.place_url&&p.url===d.place_url))){toast("이미 있는 가게예요");return}
  const item={name,cat:catOf(d.category_name),addr:d.road_address_name||d.address_name||"",dist:d.distance?Number(d.distance):null,off:null};
  if(d.place_url)item.url=d.place_url;
  save("place",[...places(),item]);
  $("placeName").value="";hideResults();toast(`'${name}' 추가했어요`);
}
$("placeSearch").addEventListener("click",searchPlace);
$("placeResults").addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b)pickResult(Number(b.dataset.pick))});

// ---- events ----
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(t)setTab(t.dataset.tab)});
$("draw").addEventListener("click",draw);
$("copy").addEventListener("click",copyPick);
$("menuFilter").addEventListener("input",renderMenus);
$("placeFilter").addEventListener("input",renderPlaces);
$("menuForm").addEventListener("submit",e=>{
  e.preventDefault();const v=$("menuName").value.trim();if(!v)return;
  if(menus().includes(v)){toast("이미 있는 메뉴예요");return}
  save("menu",[...menus(),v].sort((a,b)=>a.localeCompare(b,"ko")));$("menuName").value="";toast(`'${v}' 추가했어요`);
});
$("placeForm").addEventListener("submit",e=>{e.preventDefault();searchPlace()});
document.addEventListener("click",e=>{
  const dm=e.target.closest("[data-del-menu]");if(dm){const v=dm.dataset.delMenu;save("menu",menus().filter(m=>m!==v));toast(`'${v}' 뺐어요`);return}
  const dp=e.target.closest("[data-del-place]");if(dp){const v=dp.dataset.delPlace;save("place",places().filter(p=>p.name!==v));if(state.current?.name===v){state.current=null;renderPlate()}toast(`'${v}' 뺐어요`);return}
  const r=e.target.closest("[data-reset]");if(r){state.confirming=r.dataset.reset;renderReset(r.dataset.reset);return}
  const ry=e.target.closest("[data-reset-yes]");if(ry){const k=ry.dataset.resetYes;state.confirming=null;save(k,null);toast("처음 설정으로 되돌렸어요");return}
  if(e.target.closest("[data-reset-no]")){const k=state.confirming;state.confirming=null;renderReset(k)}
});

let startTab="menu";try{const t=localStorage.getItem("tab");if(t==="place")startTab=t}catch(e){}
setTab(startTab);renderAll();initStore();initKakao();
</script>
