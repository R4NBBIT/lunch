<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="오늘 점심 고민 해결소">
<meta property="og:type" content="website">
<meta property="og:title" content="점메추">
<meta property="og:description" content="오늘 점심 고민 해결소">
<meta property="og:url" content="https://r4nbbit.github.io/lunch-gacha/">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>점메추</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one narrow column — tab switch, a big "today's pick" plate, then the list behind the draw. */
:root{
  --bg:#FFF6D6; --surface:#FFFDF6; --sunk:#FBE9A8; --fg:#3A2E05; --muted:#7D6A2C; --line:#F0DC96;
  --yolk:#FFC21A; --yolk-ink:#3A2C00; --yolk-soft:#FFE89A; --danger:#B8391F; --ok:#7A5B00;
  --snack-bg:#3A2E05; --snack-fg:#FFF6D6; --spoon:#FFFDF6;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1808; --surface:#26200C; --sunk:#332B10; --fg:#FFF4D6; --muted:#C9B67A; --line:#433916;
  --yolk:#FFC21A; --yolk-ink:#2A1F00; --yolk-soft:#4A3B0C; --danger:#F08A70; --ok:#FFD45C;
  --snack-bg:#FFF4D6; --snack-fg:#1C1808; --spoon:#FFFDF6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1808; --surface:#26200C; --sunk:#332B10; --fg:#FFF4D6; --muted:#C9B67A; --line:#433916;
  --yolk:#FFC21A; --yolk-ink:#2A1F00; --yolk-soft:#4A3B0C; --danger:#F08A70; --ok:#FFD45C;
  --snack-bg:#FFF4D6; --snack-fg:#1C1808; --spoon:#FFFDF6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 72px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:14px;background:var(--yolk);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:28px}
.brand-text{display:flex;flex-direction:column;gap:3px;min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.sub{color:var(--muted);font-size:13px;line-height:1.3;margin:0;word-break:keep-all}
.acct{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-size:13px;color:var(--muted);min-width:0;margin-left:auto}
.acct .who{min-width:0;max-width:min(220px,42vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .linkbtn{flex:none}
.summary .btn{margin-left:auto}
@media (max-width:520px){
  header{flex-wrap:nowrap}
  .acct{flex-direction:column;align-items:flex-end;gap:2px;font-size:12px}
  .acct .who{max-width:34vw}
  .logo{width:44px;height:44px;border-radius:13px}
  h1{font-size:27px}
  .sub{font-size:12.5px}
}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:999px;padding:4px}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--yolk);color:var(--yolk-ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.plate .label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.pick{font-family:var(--display);font-size:clamp(30px,9vw,44px);line-height:1.15;margin:0;text-wrap:balance;min-height:1.2em;word-break:keep-all}
.pick.idle{color:var(--muted);font-size:22px}
.meta{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.meta a{color:var(--fg);font-weight:500}
.chip{display:inline-block;background:var(--yolk-soft);color:var(--fg);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.plate-msg{font-size:13px;color:var(--ok);min-height:1.3em;margin:0}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.main{background:var(--yolk);color:var(--yolk-ink);border-color:transparent;font-size:17px;padding:14px 28px}
.btn.primary{background:var(--yolk);color:var(--yolk-ink);border-color:transparent}
.btn.small{padding:8px 12px;font-size:13px;font-weight:500}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,.x:focus-visible,.linkbtn:focus-visible,.preset:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.linkbtn{font:inherit;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
section.list,div.list{display:flex;flex-direction:column;gap:12px}
#placeMain{gap:18px}
.sort{display:inline-flex;gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.sort button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.sort button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.sort button:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.list-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
form.add{display:flex;gap:8px}
form.add input{flex:1 1 auto}
form.add .btn{flex:none;white-space:nowrap}
.filter{width:100%}
.callout{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;background:var(--yolk-soft);border-radius:14px;padding:12px 14px}
.callout p{margin:0;font-size:14px;line-height:1.5;min-width:0;flex:1 1 220px;word-break:keep-all}
.callout b{font-weight:700}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
ul.items li{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:14px}
ul.items.readonly li{padding:6px 14px}
.x{font:inherit;border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1}
.x:hover{background:var(--sunk);color:var(--danger)}
.reset{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding-top:4px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--yolk-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.empty{color:var(--muted);font-size:14px;padding:12px 14px}
.trash{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px}
.trash summary{cursor:pointer;font-size:14px;font-weight:700;padding:2px 0}
.trash[open] summary{margin-bottom:8px}
.trash .note{margin-bottom:8px}
.trash ul.items li{color:var(--muted);background:var(--sunk);border-color:transparent}
.restore{font:inherit;font-size:12.5px;border:0;background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.restore:hover{background:var(--yolk-soft)}
.restore:focus-visible,.trash summary:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
/* 식당 목록 */
ul.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
ul.places li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px 10px 14px;border-top:1px solid var(--line);align-items:center}
ul.places li:first-child{border-top:0}
.pname{font-weight:700;min-width:0}
.pname a{color:inherit;text-decoration:none}
.pname a:hover{text-decoration:underline}
.pinfo{grid-column:1;font-size:12.5px;color:var(--muted);min-width:0}
ul.places li.skip .pname,ul.places li.skip .pinfo{opacity:.45}
.tog{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s;grid-row:1 / span 2;grid-column:2}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.tog:checked{background:var(--yolk)}
.tog:checked::after{transform:translateX(18px)}
.tog:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
/* 프리셋 */
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.preset{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:center;min-width:0;display:flex;align-items:center;justify-content:center;min-height:44px}
.preset .pn{font-weight:700;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset[aria-selected="true"]{border-color:var(--yolk);box-shadow:inset 0 0 0 1px var(--yolk);background:var(--yolk-soft)}
.preset.blank .pn{color:var(--muted);font-weight:500}
.summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.summary{align-items:flex-start}
.sum-main{min-width:0;flex:1 1 240px;display:flex;flex-direction:column;gap:8px}
.sum-title{margin:0;font-size:15px;word-break:keep-all}
.sum-title b{font-weight:700}
.sum-list{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px}
.sum-list dt{color:var(--muted);white-space:nowrap}
.sum-list dd{margin:0;min-width:0;word-break:keep-all}
.blank-card{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.blank-card p{margin:0;color:var(--muted);font-size:14px;word-break:keep-all}
/* 설정 창 */
dialog.setup{border:0;border-radius:20px;padding:0;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--fg);box-shadow:0 20px 50px rgb(0 0 0 / .3)}
dialog.setup::backdrop{background:rgb(0 0 0 / .45)}
.setup form{display:flex;flex-direction:column;gap:14px;padding:20px}
.setup h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>legend{font-size:13px;font-weight:700;padding:0}
.field .help{font-size:12px;color:var(--muted);margin:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.inline{display:flex;gap:8px}
.inline input{flex:1 1 auto}
.resolved{font-size:12.5px;margin:0;color:var(--ok);word-break:keep-all}
.resolved.bad{color:var(--danger)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg input:checked+span{background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--yolk);outline-offset:2px}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kinds label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;cursor:pointer}
.kinds label span{flex:1;min-width:0}
.kinds label em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.kinds input{accent-color:var(--yolk);margin:0;width:16px;height:16px}
.setup .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.setup .foot .row{justify-content:flex-end}
.progress{font-size:13px;color:var(--muted);margin:0}
/* 화면 아래 알림 */
.snack{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--snack-bg);color:var(--snack-fg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);width:max-content;text-align:center;word-break:keep-all;transition:opacity .2s,transform .2s;z-index:10}
.snack.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: no-preference){.pick.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:none;opacity:1}}}
@media (prefers-reduced-motion: reduce){.tog,.tog::after,.snack{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 34 40" aria-hidden="true"><ellipse cx="11" cy="9" rx="5.5" ry="7.5" fill="var(--spoon)"/><rect x="9.6" y="15" width="2.8" height="23" rx="1.4" fill="var(--spoon)"/><rect x="20" y="2" width="2.6" height="36" rx="1.3" fill="var(--yolk-ink)" transform="rotate(-4 21 20)"/><rect x="26" y="2" width="2.6" height="36" rx="1.3" fill="var(--yolk-ink)" transform="rotate(4 27 20)"/></svg></div>
      <div class="brand-text">
        <h1>점메추</h1>
        <p class="sub">오늘 점심 고민 해결소</p>
      </div>
    </div>
    <div class="acct" id="acctBar"></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-menu" aria-selected="true" data-tab="menu">메뉴 추천</button>
    <button role="tab" id="tab-place" aria-selected="false" data-tab="place">식당 추천</button>
  </div>

  <div class="plate" id="plate" aria-live="polite">
    <span class="label" id="plateLabel">오늘의 메뉴는</span>
    <p class="pick idle" id="pick">버튼을 눌러 뽑아보세요</p>
    <div class="meta" id="meta"></div>
    <div class="row">
      <button class="btn main" id="draw">🍽️ 뽑기</button>
      <button class="btn" id="copy" disabled>복사</button>
    </div>
    <p class="plate-msg" id="plateMsg"></p>
  </div>

  <section class="list" id="menuSec">
    <div class="list-head"><h2>메뉴판</h2><span class="count" id="menuCount"></span></div>
    <div class="note" id="menuNote"></div>
    <form class="add" id="menuForm" hidden>
      <input id="menuName" placeholder="추가하고 싶은 메뉴 이름을 적어주세요!" maxlength="40" autocomplete="off" aria-label="추가할 메뉴 이름">
      <button class="btn" type="submit">추가</button>
    </form>
    <input class="filter" id="menuFilter" placeholder="메뉴 찾기" autocomplete="off" aria-label="메뉴 찾기" enterkeyhint="search">
    <ul class="items" id="menuList"></ul>
    <details class="trash" id="menuHidden" hidden>
      <summary id="menuHiddenTitle"></summary>
      <p class="note">되돌리기를 누르면 내 메뉴판에 다시 들어가요.</p>
      <ul class="items" id="menuHiddenList"></ul>
    </details>
    <div class="reset" id="menuReset"></div>
  </section>

  <section class="list" id="placeSec" hidden>
    <div class="callout" id="placeGate">
      <p><b>내 주변 식당</b>을 뽑아보세요. 로그인하면 출발 위치를 정해서 걸어갈 만한 식당을 모아둘 수 있어요.</p>
      <button class="btn small" data-login>구글 로그인</button>
    </div>
    <div class="list" id="placeMain" hidden>
      <div class="presets" role="tablist" aria-label="내 프리셋" id="presetBar"></div>
      <div class="blank-card" id="presetBlank" hidden>
        <p>이 프리셋은 비어 있어요. 출발 위치와 걸어갈 시간을 정하면 주변 식당을 모아드려요.</p>
        <button class="btn primary" data-setup>식당 목록 만들기</button>
      </div>
      <div class="list" id="presetBody" hidden>
        <div class="summary">
          <div class="sum-main" id="presetSummary"></div>
          <button class="btn small" data-setup>설정 바꾸기</button>
        </div>
        <div class="list-head"><h2>식당 목록</h2><span class="count" id="placeCount"></span></div>
        <div class="list-tools">
          <p class="note">뽑기에서 빼고 싶은 식당은 스위치를 꺼두세요.</p>
          <div class="sort" role="group" aria-label="정렬">
            <button type="button" data-sort="dist">거리순</button>
            <button type="button" data-sort="name">가나다순</button>
          </div>
        </div>
        <input class="filter" id="placeFilter" placeholder="식당·종류 찾기" autocomplete="off" aria-label="식당 찾기" enterkeyhint="search">
        <ul class="places" id="placeList"></ul>
      </div>
    </div>
  </section>
</div>

<dialog class="setup" id="setup" aria-labelledby="setupTitle">
  <form method="dialog" id="setupForm">
    <h2 id="setupTitle">프리셋 설정</h2>
    <div class="field">
      <label for="sName">프리셋 이름</label>
      <input id="sName" maxlength="20" autocomplete="off" placeholder="예: 회사, 집 근처">
    </div>
    <div class="field">
      <label for="sOrigin">출발 위치</label>
      <div class="inline">
        <input id="sOrigin" maxlength="60" autocomplete="off" placeholder="주소나 건물 이름">
        <button class="btn small" type="button" id="sFind">확인</button>
      </div>
      <p class="resolved" id="sOriginMsg"></p>
    </div>
    <fieldset class="field">
      <legend>걸어서</legend>
      <div class="seg" id="sMinutes"></div>
    </fieldset>
    <div class="row" style="justify-content:flex-start"><button class="btn primary" type="button" id="sScan">식당 찾기</button></div>
    <p class="progress" id="sProgress" role="status"></p>
    <fieldset class="field" id="sKindsBox" hidden>
      <legend>뽑기에 넣을 종류</legend>
      <div class="kinds" id="sKinds"></div>
    </fieldset>
    <div class="foot">
      <button class="btn small danger" type="button" id="sClear" hidden>프리셋 비우기</button>
      <div class="row">
        <button class="btn" type="button" id="sCancel">취소</button>
        <button class="btn primary" type="button" id="sSave" disabled>저장</button>
      </div>
    </div>
  </form>
</dialog>

<div class="snack" id="snack" role="status" aria-live="polite"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1bda94cad12b66df82a326d476ecfe13&libraries=services&autoload=false"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=id=>document.getElementById(id);
const ko=(a,b)=>a.localeCompare(b,"ko");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function mapLink(name){return "https://map.kakao.com/link/search/"+encodeURIComponent(name)}

const safeUrl=u=>typeof u==="string"&&/^https?:\/\//i.test(u)?u:"";

// ---- 알림: 뽑기 관련은 뽑기 아래, 나머지는 화면 아래 ----
let plateT,snackT;
function plateMsg(m){$("plateMsg").textContent=m;clearTimeout(plateT);plateT=setTimeout(()=>$("plateMsg").textContent="",2400)}
function toast(m){const s=$("snack");s.textContent=m;s.classList.add("show");clearTimeout(snackT);snackT=setTimeout(()=>s.classList.remove("show"),2600)}

// ---- 메뉴 ----
function menus(){
  if(!state.isGoogle)return DEFAULT_MENUS;
  const hidden=new Set(state.mine.hidden);
  const base=DEFAULT_MENUS.filter(m=>!hidden.has(m));
  return [...base,...state.mine.added.filter(m=>!base.includes(m))].sort(ko);
}
// ---- 식당 (지금 고른 프리셋) ----
const preset=()=>state.presets[state.active];
function pool(){
  const p=preset();if(!p)return [];
  const kinds=new Set(p.kinds),skip=new Set(p.skip);
  return p.items.filter(i=>kinds.has(i.kind)&&!skip.has(placeKey(i)));
}

// ---- 탭 & 뽑기 ----
function setTab(t){
  state.tab=t;state.current=null;state.confirming=null;
  for(const b of document.querySelectorAll(".tabs button"))b.setAttribute("aria-selected",String(b.dataset.tab===t));
  $("menuSec").hidden=t!=="menu";$("placeSec").hidden=t!=="place";
  $("plateLabel").textContent=t==="menu"?"오늘의 메뉴는":"오늘 갈 곳은";
  $("plateMsg").textContent="";
  renderAll();
  try{localStorage.setItem("tab",t)}catch(e){}
}
function draw(){
  const t=state.tab,list=t==="menu"?menus():pool();
  if(!list.length){state.current=null;renderPlate();plateMsg(t==="menu"?"메뉴판이 비어 있어요":"뽑을 식당이 없어요. 스위치나 종류를 확인해주세요");return}
  let pick;const last=state.last[t];
  for(let i=0;i<8;i++){pick=list[Math.floor(Math.random()*list.length)];if(list.length<2||(t==="menu"?pick!==last:pick.name!==last?.name))break}
  state.last[t]=pick;state.current=pick;renderPlate();
  const el=$("pick");el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
}
function renderPlate(){
  $("plate").hidden=state.tab==="place"&&!preset();
  const el=$("pick"),meta=$("meta"),c=state.current;
  $("copy").disabled=!c;
  if(!c){el.className="pick idle";el.textContent="버튼을 눌러 뽑아보세요";meta.innerHTML="";$("draw").textContent="🍽️ 뽑기";return}
  el.className="pick";$("draw").textContent="🍽️ 다시 뽑기";
  if(state.tab==="menu"){el.textContent=c;meta.innerHTML="";return}
  el.textContent=c.name;
  meta.innerHTML=`<div>${c.cat?`<span class="chip">${esc(fmtCat(c.cat))}</span> `:""}${c.dist!=null?`출발 위치에서 ${c.dist}m`:""}</div>
    <div>${esc(c.addr||"")}</div>
    <div><a href="${esc(linkOf(c))}" target="_blank" rel="noopener noreferrer">카카오맵에서 보기 ↗</a></div>`;
}
async function copyPick(){
  const c=state.current;if(!c)return;
  const body=state.tab==="menu"?`🍽️ 오늘 점심 메뉴: ${c}`:`🍽️ 오늘 점심은 ${c.name}!${c.cat?` (${c.cat})`:""}\n📍 ${c.addr||""}\n${linkOf(c)}`;
  const text=`${body}\n\n🎰 나도 점심 뽑아보기 👉 ${SITE_URL}`;
  try{await navigator.clipboard.writeText(text);plateMsg("복사됐어요")}
  catch(e){const r=document.createRange();r.selectNodeContents($("plate"));const s=getSelection();s.removeAllRanges();s.addRange(r);plateMsg("복사가 막혀 있어서 선택만 해뒀어요. 길게 눌러 복사하세요")}
}

// ---- 메뉴 탭 ----
function renderMenus(){
  const all=menus(),q=$("menuFilter").value.trim(),edit=state.isGoogle;
  const shown=q?all.filter(m=>m.includes(q)):all;
  $("menuCount").textContent=`${all.length}개 | ${edit?"내 메뉴판":"기본 메뉴판"}`;
  const note=$("menuNote");
  if(edit){note.className="note";note.textContent="내가 추가하거나 지운 메뉴는 나에게만 적용돼요."}
  else{note.className="callout";note.innerHTML=`<p><b>나만의 메뉴판</b>을 만들어보세요. 로그인하면 메뉴를 추가하거나 뺄 수 있어요.</p><button class="btn small" data-login>구글 로그인</button>`}
  $("menuForm").hidden=!edit;
  $("menuList").classList.toggle("readonly",!edit);
  $("menuList").innerHTML=shown.length?shown.map(m=>`<li>${esc(m)}${edit?`<button class="x" data-del-menu="${esc(m)}" aria-label="${esc(m)} 빼기">×</button>`:""}</li>`).join(""):`<li class="empty" style="border:0;background:none">${q?"찾는 메뉴가 없어요":"메뉴가 비어 있어요. 위에서 추가해보세요"}</li>`;
  const hid=$("menuHidden"),hidden=edit?state.mine.hidden.filter(m=>DEFAULT_MENUS.includes(m)).sort(ko):[];
  hid.hidden=!hidden.length;
  if(hidden.length){
    $("menuHiddenTitle").textContent=`뺀 기본 메뉴 ${hidden.length}개`;
    $("menuHiddenList").innerHTML=hidden.map(m=>`<li>${esc(m)}<button class="restore" data-restore-menu="${esc(m)}" aria-label="${esc(m)} 되돌리기">되돌리기</button></li>`).join("");
  }
  const box=$("menuReset");
  if(!edit){box.innerHTML="";return}
  const changed=state.mine.added.length||state.mine.hidden.length;
  box.innerHTML=state.confirming==="menu"
    ?`<div class="confirm">내 메뉴판을 기본 메뉴판으로 되돌릴까요? 내가 추가·삭제한 내용이 모두 사라져요.<button class="btn small danger" data-yes="menu">되돌리기</button><button class="btn small" data-no>취소</button></div>`
    :`<button class="btn small" data-ask="menu" ${changed?"":"disabled"}>내 메뉴판 초기화</button>`;
}
function addMenu(v){
  const m=state.mine;
  if(m.hidden.includes(v)){saveMine({added:m.added,hidden:m.hidden.filter(x=>x!==v)});toast(`'${v}' 다시 넣었어요`);return}
  if(menus().includes(v)){toast("이미 있는 메뉴예요");return}
  saveMine({added:[...m.added,v],hidden:m.hidden});toast(`'${v}' 추가했어요`);
}
function removeMenu(v){
  const m=state.mine;
  if(m.added.includes(v)){saveMine({added:m.added.filter(x=>x!==v),hidden:m.hidden});toast(`'${v}' 지웠어요`)}
  else{saveMine({added:m.added,hidden:[...m.hidden,v]});toast(`'${v}' 뺐어요. 아래 '뺀 기본 메뉴'에서 되돌릴 수 있어요`)}
}

// ---- 식당 탭 ----
function renderPlaces(){
  $("placeGate").hidden=state.isGoogle;$("placeMain").hidden=!state.isGoogle;
  if(!state.isGoogle)return;
  $("presetBar").innerHTML=PRESETS.map((id,i)=>{const p=state.presets[id];return `<button class="preset${p?"":" blank"}" role="tab" aria-selected="${id===state.active}" data-preset="${id}"><span class="pn">${esc(p?p.name:`프리셋 ${i+1}`)}</span></button>`}).join("");
  const p=preset();
  $("presetBlank").hidden=!!p;$("presetBody").hidden=!p;
  if(!p)return;
  $("presetSummary").innerHTML=`<p class="sum-title"><b>${esc(p.origin.label)}</b>에서 걸어서 <b>${p.minutes}분</b></p>
    <dl class="sum-list"><dt>음식 종류</dt><dd>${esc(p.kinds.join(", ")||"고른 종류 없음")}</dd></dl>`;
  const kinds=new Set(p.kinds),skip=new Set(p.skip);
  const all=p.items.filter(i=>kinds.has(i.kind));
  const q=$("placeFilter").value.trim();
  let shown=q?all.filter(i=>(i.name+" "+(i.cat||"")).includes(q)):all;
  shown=[...shown].sort(state.sort==="name"?(a,b)=>ko(a.name,b.name):(a,b)=>(a.dist??1e9)-(b.dist??1e9)||ko(a.name,b.name));
  for(const b of document.querySelectorAll("[data-sort]"))b.setAttribute("aria-pressed",String(b.dataset.sort===state.sort));
  $("placeCount").textContent=`${all.length}곳 | 뽑기 ${all.filter(i=>!skip.has(placeKey(i))).length}곳`;
  $("placeList").innerHTML=shown.length?shown.map(i=>{const k=placeKey(i),off=skip.has(k);
    return `<li class="${off?"skip":""}"><span class="pname"><a href="${esc(linkOf(i))}" target="_blank" rel="noopener noreferrer">${esc(i.name)}</a></span>
    <span class="pinfo">${[fmtCat(i.cat),i.dist!=null?i.dist+"m":"",i.addr].filter(Boolean).map(esc).join(" | ")}</span>
    <input type="checkbox" class="tog" role="switch" data-skip="${esc(k)}" ${off?"":"checked"} aria-label="${esc(i.name)} 뽑기에 넣기"></li>`}).join("")
    :`<li class="empty">${q?"찾는 식당이 없어요":"고른 종류에 해당하는 식당이 없어요"}</li>`;
}
function renderAll(){renderMenus();renderPlaces();renderPlate()}

const cleanStrs=v=>Array.isArray(v)?v.filter(m=>typeof m==="string"&&m.trim()):[];
function cleanPreset(d){
  if(!d||!Array.isArray(d.items)||!d.origin)return null;
  const o=d.origin||{},str=v=>typeof v==="string"?v:"",num=v=>Number.isFinite(v)?v:null;
  return {name:str(d.name).slice(0,20)||"프리셋",origin:{label:str(o.label),query:str(o.query),lat:num(o.lat),lng:num(o.lng)},dong:"",minutes:MINUTES.includes(d.minutes)?d.minutes:20,
    kinds:cleanStrs(d.kinds),skip:cleanStrs(d.skip),
    items:d.items.filter(i=>i&&typeof i.name==="string").map(i=>({name:i.name,cat:str(i.cat),kind:str(i.kind)||"기타",addr:str(i.addr),dist:num(i.dist),url:safeUrl(i.url)}))};
}
let db,auth,unsubs=[];
const queue={};
function enqueue(k,fn){queue[k]=(queue[k]||Promise.resolve()).then(fn)}
function saveMine(next){
  state.mine=next;renderAll();
  const uid=state.user?.uid;if(!uid)return;
  enqueue("mine",()=>setDoc(doc(db,"users",uid),next).catch(()=>toast("저장하지 못했어요. 잠시 후 다시 해보세요")));
}
function presetRef(id){return doc(db,"users",state.user.uid,"presets",id)}
function savePresetPart(id,part){
  enqueue(id,()=>setDoc(presetRef(id),part,{merge:true}).catch(()=>toast("저장하지 못했어요. 잠시 후 다시 해보세요")));
}
function handleUser(u){
  state.user=u;state.isGoogle=!!u&&u.providerData.some(p=>p.providerId==="google.com");
  state.confirming=null;
  unsubs.forEach(f=>f());unsubs=[];
  state.mine={added:[],hidden:[]};state.presets={p1:null,p2:null,p3:null};
  if(state.isGoogle){
    try{const a=localStorage.getItem("preset:"+u.uid);if(PRESETS.includes(a))state.active=a}catch(e){}
    unsubs.push(onSnapshot(doc(db,"users",u.uid),s=>{const d=s.exists()?s.data():{};state.mine={added:cleanStrs(d.added),hidden:cleanStrs(d.hidden)};renderAll()},()=>{}));
    for(const id of PRESETS)unsubs.push(onSnapshot(presetRef(id),s=>{state.presets[id]=s.exists()?cleanPreset(s.data()):null;if(state.tab==="place"&&id===state.active&&!state.presets[id])state.current=null;renderAll()},()=>{}));
  }
  renderAcct();renderAll();
}

  catch(e){if(e?.code!=="auth/popup-closed-by-user"&&e?.code!=="auth/cancelled-popup-request")toast("로그인하지 못했어요. 팝업 차단을 확인해주세요")}
}
function initFirebase(){
  try{
    const app=initializeApp(firebaseConfig);
    db=getFirestore(app);auth=getAuth(app);state.auth=auth;
    onAuthStateChanged(auth,handleUser);
  }catch(e){toast("저장소에 연결하지 못했어요. 새로고침해 주세요")}
}

// ---- 카카오: 출발 위치 찾기, 주변 식당 모으기 ----
const kk={ready:false};
function initKakao(){
  const k=window.kakao;
  if(!k||!k.maps||!k.maps.load)return;
  k.maps.load(()=>{kk.places=new k.maps.services.Places();kk.geo=new k.maps.services.Geocoder();kk.ready=true});
}
function findOrigin(q){
  const S=window.kakao.maps.services;
  return new Promise(res=>{
    kk.geo.addressSearch(q,(r,st)=>{
      if(st===S.Status.OK&&r[0])return res({label:r[0].road_address?.address_name||r[0].address_name,lat:Number(r[0].y),lng:Number(r[0].x)});
      kk.places.keywordSearch(q,(d,st2)=>{
        if(st2===S.Status.OK&&d[0])return res({label:`${d[0].place_name} (${d[0].road_address_name||d[0].address_name})`,lat:Number(d[0].y),lng:Number(d[0].x)});
        res(null);
      });
    });
  });
}
function meters(lat1,lng1,lat2,lng2){
  const R=6371000,t=x=>x*Math.PI/180,a=Math.sin(t(lat2-lat1)/2)**2+Math.cos(t(lat1))*Math.cos(t(lat2))*Math.sin(t(lng2-lng1)/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
// 카카오는 한 번에 최대 45곳만 알려주고 전체 개수도 45까지만 알려줌 → 꽉 차면 구역을 4등분해서 다시 찾음
let slots=4;const waiters=[];
async function turn(fn){if(slots<=0)await new Promise(r=>waiters.push(r));else slots--;try{return await fn()}finally{const n=waiters.shift();if(n)n();else slots++}}
function query(code,sw,ne){
  const k=window.kakao,S=k.maps.services;
  const bounds=new k.maps.LatLngBounds(new k.maps.LatLng(sw[0],sw[1]),new k.maps.LatLng(ne[0],ne[1]));
  return new Promise(res=>{const rows=[];let total=0;
    kk.places.categorySearch(code,(d,st,pg)=>{if(st!==S.Status.OK)return res({rows,total});total=pg.totalCount;rows.push(...d);if(pg.hasNextPage)pg.nextPage();else res({rows,total})},{bounds});
  });
}
async function scanRect(code,sw,ne,found,depth,onFound){
  const {rows,total}=await turn(()=>query(code,sw,ne));
  for(const d of rows)found.set(d.id,{...d,_code:code});
  onFound(found.size);
  if(total>=45&&depth<8){
    const a=(sw[0]+ne[0])/2,b=(sw[1]+ne[1])/2;
    await Promise.all([[sw,[a,b]],[[sw[0],b],[a,ne[1]]],[[a,sw[1]],[ne[0],b]],[[a,b],ne]].map(([s,n])=>scanRect(code,s,n,found,depth+1,onFound)));
  }
}
function kindOf(d){
  if(d._code==="CE7")return "카페";
  return String(d.category_name||"").split(">").map(x=>x.trim())[1]||"기타";
}
function catOf(c){const p=String(c||"").split(">").map(x=>x.trim()).filter(Boolean);return p.length>1?p.slice(1).join(" | "):(p[0]||"")}
async function scanPlaces(origin,minutes,onFound){
  const R=minutes*M_PER_MIN,dLat=R/111320,dLng=R/(111320*Math.cos(origin.lat*Math.PI/180));
  const sw=[origin.lat-dLat,origin.lng-dLng],ne=[origin.lat+dLat,origin.lng+dLng];
  const found=new Map();
  await Promise.all(["FD6","CE7"].map(code=>scanRect(code,sw,ne,found,0,onFound)));
  const items=[];
  for(const d of found.values()){
    const dist=Math.round(meters(origin.lat,origin.lng,Number(d.y),Number(d.x)));
    if(dist>R)continue;
    const o={name:d.place_name,cat:catOf(d.category_name),kind:kindOf(d),addr:d.road_address_name||d.address_name||"",dist};
    if(d.place_url)o.url=d.place_url;
    items.push(o);
  }
  items.sort((a,b)=>a.dist-b.dist);
  return items.slice(0,MAX_PLACES);
}

// ---- 프리셋 설정 창 ----
const setup={origin:null,items:null,dirty:false,scanning:false};
function kindsOf(items){const c={};for(const i of items)c[i.kind]=(c[i.kind]||0)+1;
  return Object.keys(c).sort((a,b)=>{const ia=KIND_ORDER.indexOf(a),ib=KIND_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||c[b]-c[a]}).map(k=>({kind:k,n:c[k]}))}
function renderKinds(selected){
  const box=$("sKindsBox");
  if(!setup.items||setup.dirty){box.hidden=true;$("sSave").disabled=true;return}
  const list=kindsOf(setup.items);
  $("sKinds").innerHTML=list.map(({kind,n})=>`<label><input type="checkbox" value="${esc(kind)}" ${selected.has(kind)?"checked":""}><span>${esc(kind)}</span><em>${n}</em></label>`).join("");
  box.hidden=!list.length;
  $("sSave").disabled=!list.length;
}
function markDirty(){if(setup.items){setup.dirty=true;renderKinds(new Set());$("sProgress").textContent="바뀐 설정으로 식당 찾기를 다시 눌러주세요."}}
function openSetup(){
  const p=preset(),i=PRESETS.indexOf(state.active)+1;
  $("sName").value=p?p.name:`프리셋 ${i}`;
  $("sOrigin").value=p?p.origin.query||p.origin.label:"";
  setup.origin=p?p.origin:null;setup.items=p?p.items:null;setup.dirty=false;setup.scanning=false;
  const msg=$("sOriginMsg");msg.className="resolved";msg.textContent=p?`✓ ${p.origin.label}`:"";
  const m=p?p.minutes:20;
  $("sMinutes").innerHTML=MINUTES.map(v=>`<label><input type="radio" name="sMin" value="${v}" ${v===m?"checked":""}><span>${v}분</span></label>`).join("");
  $("sProgress").textContent=p?`${p.items.length}곳을 찾아뒀어요. 종류만 바꿔도 돼요.`:"";
  renderKinds(new Set(p?p.kinds:[]));
  $("sClear").hidden=!p;$("sClear").textContent="프리셋 비우기";delete $("sClear").dataset.sure;
  $("setup").showModal();
}
async function resolveOrigin(){
  const q=$("sOrigin").value.trim(),msg=$("sOriginMsg");
  if(!q){msg.className="resolved bad";msg.textContent="출발 위치를 입력해주세요.";return null}
  if(!kk.ready){msg.className="resolved bad";msg.textContent="지도에 연결되지 않았어요. 새로고침 후 다시 해주세요.";return null}
  msg.className="resolved";msg.textContent="찾는 중…";
  const o=await findOrigin(q);
  if(!o){msg.className="resolved bad";msg.textContent="그 위치를 찾지 못했어요. 도로명 주소나 건물 이름으로 다시 적어주세요.";return null}
  o.query=q;setup.origin=o;msg.className="resolved";msg.textContent=`✓ ${o.label}`;return o;
}
async function runScan(){
  if(setup.scanning)return;
  const o=(setup.origin&&setup.origin.query===$("sOrigin").value.trim())?setup.origin:await resolveOrigin();
  if(!o)return;
  const minutes=Number(document.querySelector('input[name="sMin"]:checked')?.value)||20;
  setup.scanning=true;$("sScan").disabled=true;$("sSave").disabled=true;$("sKindsBox").hidden=true;
  $("sProgress").textContent="주변 식당을 찾는 중이에요…";
  try{
    const items=await scanPlaces(o,minutes,n=>{$("sProgress").textContent=`주변 식당을 찾는 중이에요… ${n}곳 확인`});
    setup.items=items;setup.dirty=false;
    $("sProgress").textContent=items.length?`${items.length}곳을 찾았어요. 뽑기에 넣을 종류를 골라주세요.${items.length>=MAX_PLACES?` (가까운 ${MAX_PLACES}곳까지만 저장해요)`:""}`:"조건에 맞는 식당이 없어요. 출발 위치나 시간을 바꿔보세요.";
    const p=preset(),keep=p&&!setup.dirty?new Set(p.kinds):null;
    renderKinds(keep&&keep.size?keep:new Set(kindsOf(items).map(k=>k.kind)));
  }catch(e){$("sProgress").textContent="식당을 찾지 못했어요. 잠시 후 다시 해주세요."}
  finally{setup.scanning=false;$("sScan").disabled=false}
}
async function saveSetup(){
  if(!setup.items||setup.dirty||!state.isGoogle)return;
  const kinds=[...$("sKinds").querySelectorAll("input:checked")].map(i=>i.value);
  if(!kinds.length){$("sProgress").textContent="종류를 하나 이상 골라주세요.";return}
  const p=preset();
  const sameList=p&&p.items===setup.items;
  const data={
    name:$("sName").value.trim()||`프리셋 ${PRESETS.indexOf(state.active)+1}`,
    origin:{label:setup.origin.label,query:setup.origin.query||"",lat:setup.origin.lat,lng:setup.origin.lng},
    dong:"",
    minutes:Number(document.querySelector('input[name="sMin"]:checked')?.value)||20,
    kinds,items:setup.items,skip:sameList?p.skip:[]
  };
  $("sSave").disabled=true;
  try{await setDoc(presetRef(state.active),data);$("setup").close();state.current=null;toast(`'${data.name}' 저장했어요`)}
  catch(e){$("sSave").disabled=false;$("sProgress").textContent="저장하지 못했어요. 잠시 후 다시 해주세요."}
}
async function clearPreset(){
  const b=$("sClear");
  if(!b.dataset.sure){b.dataset.sure="1";b.textContent="정말 비울까요? 한 번 더 누르세요";return}
  try{await deleteDoc(presetRef(state.active));$("setup").close();state.current=null;toast("프리셋을 비웠어요")}
  catch(e){toast("비우지 못했어요. 잠시 후 다시 해주세요")}
}

// ---- 이벤트 ----
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(t)setTab(t.dataset.tab)});
$("draw").addEventListener("click",draw);
$("copy").addEventListener("click",copyPick);
$("menuFilter").addEventListener("input",renderMenus);
$("placeFilter").addEventListener("input",renderPlaces);
for(const id of ["menuFilter","placeFilter"])$(id).addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)e.target.blur()});
$("menuForm").addEventListener("submit",e=>{e.preventDefault();const v=$("menuName").value.trim();if(!v||!state.isGoogle)return;addMenu(v);$("menuName").value=""});
$("sFind").addEventListener("click",()=>{resolveOrigin();markDirty()});
$("sScan").addEventListener("click",runScan);
$("sSave").addEventListener("click",saveSetup);
$("sCancel").addEventListener("click",()=>$("setup").close());
$("sClear").addEventListener("click",clearPreset);
$("sOrigin").addEventListener("input",()=>{setup.origin=null;$("sOriginMsg").textContent="";markDirty()});
$("sOrigin").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();resolveOrigin()}});
$("sMinutes").addEventListener("change",markDirty);
$("setupForm").addEventListener("submit",e=>e.preventDefault());
document.addEventListener("change",e=>{
  const t=e.target;if(!t.matches?.(".tog[data-skip]"))return;
  const p=preset();if(!p)return;
  const k=t.dataset.skip,skip=new Set(p.skip);
  if(t.checked)skip.delete(k);else skip.add(k);
  p.skip=[...skip];renderPlaces();
  savePresetPart(state.active,{skip:p.skip});
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||t.closest("dialog"))return;
  if(t.hasAttribute("data-login")){login();return}
  if(t.hasAttribute("data-logout")){signOut(auth).then(()=>toast("로그아웃했어요"));return}
  if(t.hasAttribute("data-setup")){openSetup();return}
  if(t.dataset.sort){state.sort=t.dataset.sort;try{localStorage.setItem("sort",state.sort)}catch(err){}renderPlaces();return}
  if(t.dataset.preset){state.active=t.dataset.preset;state.current=null;try{localStorage.setItem("preset:"+state.user.uid,state.active)}catch(err){}renderAll();return}
  if(t.dataset.delMenu!=null){removeMenu(t.dataset.delMenu);return}
  if(t.dataset.restoreMenu!=null){const v=t.dataset.restoreMenu;saveMine({added:state.mine.added,hidden:state.mine.hidden.filter(x=>x!==v)});toast(`'${v}' 되돌렸어요`);return}
  if(t.dataset.ask){state.confirming=t.dataset.ask;renderAll();return}
  if(t.hasAttribute("data-no")){state.confirming=null;renderAll();return}
  if(t.dataset.yes==="menu"){state.confirming=null;saveMine({added:[],hidden:[]});toast("기본 메뉴판으로 되돌렸어요")}
});

try{if(localStorage.getItem("sort")==="name")state.sort="name"}catch(e){}
let startTab="menu";try{if(localStorage.getItem("tab")==="place")startTab="place"}catch(e){}
setTab(startTab);initFirebase();initKakao();
</script>
