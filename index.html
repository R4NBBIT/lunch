<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="점심 메뉴·맛집 뽑기">
<title>점메추</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one narrow column — tab switch, a big "today's pick" plate, then the shared list you edit together. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E8ECE4; --fg:#1E2722; --muted:#5E6A63; --line:#D5DCD2;
  --yolk:#F2B705; --yolk-ink:#3A2C00; --yolk-soft:#FFF1C2; --danger:#C2412D; --ok:#2F7A4F;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151A17; --surface:#1E2521; --sunk:#262E29; --fg:#ECF0EA; --muted:#9AA69F; --line:#323B35;
  --yolk:#F5C230; --yolk-ink:#2A2000; --yolk-soft:#3A3115; --danger:#EF7A66; --ok:#6CC28F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151A17; --surface:#1E2521; --sunk:#262E29; --fg:#ECF0EA; --muted:#9AA69F; --line:#323B35;
  --yolk:#F5C230; --yolk-ink:#2A2000; --yolk-soft:#3A3115; --danger:#EF7A66; --ok:#6CC28F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:10px}
.egg{width:34px;height:40px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:999px;padding:4px}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.plate .label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.pick{font-family:var(--display);font-size:clamp(30px,9vw,44px);line-height:1.15;margin:0;text-wrap:balance;min-height:1.2em;word-break:keep-all}
.pick.idle{color:var(--muted);font-size:22px}
.meta{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-height:0}
.meta a{color:var(--fg);font-weight:500}
.chip{display:inline-block;background:var(--yolk-soft);color:var(--fg);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.main{background:var(--yolk);color:var(--yolk-ink);border-color:transparent;font-size:17px;padding:14px 28px}
.btn.small{padding:8px 12px;font-size:13px;font-weight:500}
.btn.danger{color:var(--danger)}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,.x:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:12.5px;color:var(--muted);margin:0}
.admin{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.linkbtn{font:inherit;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.linkbtn:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.admin code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:12px;word-break:break-all}
.toast{font-size:13px;color:var(--ok);min-height:1.3em;margin:0}
section.list{display:flex;flex-direction:column;gap:12px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
form.add{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
form.add input[name="name"]{flex:2 1 160px}
form.add .opt{flex:1 1 110px}
.addlabel{width:100%;font-weight:700;font-size:14px}
.searchrow{display:flex;gap:8px;width:100%}
.searchrow input{flex:1 1 auto}
.results{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.results li+li{border-top:1px solid var(--line)}
.results button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:10px 12px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--yolk-soft)}
.results .rn{font-weight:700;min-width:0}
.results .rd{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.results .ra{grid-column:1 / -1;color:var(--muted);font-size:12.5px}
.results .rmsg{padding:10px 12px;color:var(--muted);font-size:13.5px}
.hint{width:100%;font-size:12.5px;color:var(--muted);margin:0}
.filter{width:100%}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
ul.items li{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:14px}
ul.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
ul.places li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 8px 10px 14px;border-top:1px solid var(--line);align-items:center}
ul.places li:first-child{border-top:0}
ul.places li.off{opacity:.55}
.pname{font-weight:700;min-width:0}
.pname a{color:inherit;text-decoration:none}
.pname a:hover{text-decoration:underline}
.pinfo{grid-column:1;font-size:12.5px;color:var(--muted);min-width:0}
.x{grid-row:1 / span 2;grid-column:2;font:inherit;border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
ul.items .x{width:26px;height:26px;font-size:15px}
.x:hover{background:var(--sunk);color:var(--danger)}
.reset{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding-top:4px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--yolk-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
@media (prefers-reduced-motion: no-preference){.pick.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:none;opacity:1}}}
.acct{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:flex-end;font-size:13px;color:var(--muted);min-height:32px}
.acct .who{min-width:0;overflow-wrap:anywhere}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.lock h2{font-size:20px}
.lock p{margin:0;color:var(--muted);font-size:14px}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1 1 auto}
.pwmsg{min-height:1.3em;font-size:13px;color:var(--danger);margin:0}
.tools{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.tools .row{justify-content:flex-start}
.tools label{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="egg" viewBox="0 0 34 40" aria-hidden="true"><ellipse cx="11" cy="9" rx="5.5" ry="7.5" fill="var(--yolk)"/><rect x="9.6" y="15" width="2.8" height="23" rx="1.4" fill="var(--yolk)"/><rect x="20" y="2" width="2.6" height="36" rx="1.3" fill="var(--fg)" transform="rotate(-4 21 20)"/><rect x="26" y="2" width="2.6" height="36" rx="1.3" fill="var(--fg)" transform="rotate(4 27 20)"/></svg>
    <div>
      <h1>점메추</h1>
      <p class="sub">오늘 점심 고민 해결소</p>
    </div>
  </header>

  <div class="acct" id="acctBar"></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-menu" aria-selected="true" data-tab="menu">메뉴 추천</button>
    <button role="tab" id="tab-place" aria-selected="false" data-tab="place">맛집 추천</button>
  </div>

  <div class="plate" id="plate" aria-live="polite">
    <span class="label" id="plateLabel">오늘의 메뉴는</span>
    <p class="pick idle" id="pick">버튼을 눌러 뽑아보세요</p>
    <div class="meta" id="meta"></div>
    <div class="row">
      <button class="btn main" id="draw">🍽️ 뽑기</button>
      <button class="btn" id="copy" disabled>복사</button>
    </div>
    <p class="note" id="offNote" hidden></p>
    <p class="toast" id="toast"></p>
  </div>

  <section class="list" id="menuSec">
    <div class="list-head"><h2>메뉴판</h2><span class="count" id="menuCount"></span></div>
    <p class="note" id="menuNote"></p>
    <form class="add" id="menuForm" hidden>
      <input id="menuName" name="name" placeholder="메뉴 이름 (예: 김치볶음밥)" maxlength="40" autocomplete="off">
      <button class="btn" type="submit">추가</button>
    </form>
    <input class="filter" id="menuFilter" placeholder="메뉴 찾기" autocomplete="off">
    <ul class="items" id="menuList"></ul>
    <div class="reset" id="menuReset"></div>
  </section>

  <section class="list" id="placeSec" hidden>
    <div class="lock" id="placeLock" hidden>
      <h2>회사 사람만 쓰는 탭이에요</h2>
      <p>비밀번호를 입력하면 이 기기에서는 계속 쓸 수 있어요.</p>
      <form class="pwrow" id="pwForm">
        <input id="pwInput" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호">
        <button class="btn" type="submit">확인</button>
      </form>
      <p class="pwmsg" id="pwMsg" role="alert"></p>
    </div>
    <div class="list" id="placeBody" hidden>
      <div class="list-head"><h2>회사 근처 맛집</h2><span class="count" id="placeCount"></span></div>
      <form class="add" id="placeForm">
        <label class="addlabel" for="placeName">맛집 추가하기</label>
        <div class="searchrow">
          <input id="placeName" name="name" placeholder="가게 이름 (예: 미돈)" maxlength="40" autocomplete="off">
          <button class="btn" type="button" id="placeSearch" disabled>검색</button>
        </div>
        <ul class="results" id="placeResults" hidden></ul>
        <p class="hint" id="placeHint">가게 이름을 넣고 검색한 뒤, 맞는 가게를 누르면 바로 추가돼요.</p>
      </form>
      <input class="filter" id="placeFilter" placeholder="가게·종류 찾기" autocomplete="off">
      <ul class="places" id="placeList"></ul>
      <div id="adminTools"></div>
    </div>
  </section>

  <p class="note" id="syncNote"></p>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1bda94cad12b66df82a326d476ecfe13&libraries=services&autoload=false"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,onSnapshot,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,linkWithPopup,signInWithCredential,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const DAYS=["일","월","화","수","목","금","토"];
const DEFAULT_MENUS=`가츠동 간장게장 간장계란밥 간장비빔국수 갈비탕 갈치조림 감바스·알·아히요 감자탕 계란말이 계란찜 고등어구이 고양이똥커피 골뱅이소면 곱창전골 굶어 김밥에·라면 김치찌개 김치찜 나시고렝 낙지볶음 내장탕 냉면 뇨끼 뉴욕핫도그 닭갈비 닭곰탕 닭볶음탕 닭칼국수 대패삼겹덮밥 도가니탕 돈까스 동태탕 동파육 돼지국밥 두부김치 들기름막국수 들깨칼국수 떡국 떡볶이 뚝배기불고기 라멘 라자냐 로코모코 마라탕 마제소바 마파두부 막국수 만두 매운·갈비찜 메밀전병 명태찜 모밀소바 묵사발 물냉면 방울토마토라면 백순대볶음 봄동비빔밥 봉구스밥버거 부대찌개 불고기 불닭발 비냉면 비빔밥 뼈해장국 삼겹살 샌드위치 샐러드파스타 샤브샤브 설렁탕 소불고기전골 순대국밥 순두부찌개 숯불닭갈비 쌀국수 쌈밥 아구찜 알밥 야채곱창 양꼬치 에그인헬 에스카르고 연포탕 오뎅탕 오므라이스 오믈렛 오야코동 오징어볶음 우동 우렁쌈밥 육개장 육회비빔밥 이삭토스트 잔치국수 잡채밥 제육볶음 조개구이 짜장면 짬뽕 쫄면 쭈꾸미삼겹살 찜닭 차돌된장찌개 차슈덮밥 참치마요 철판볶음밥 초계국수 치킨마요 카레 코다리찜 콩국수 퀘사디아 크림스파게티 클램차우더·수프 타코 탕수육 텐동 토마토와사비 파니니샌드위치 파스타 파전에·동동주 팬케이크 편백찜 포케 피자 해물계란탕 해물찜 해물탕 해신탕 햄부기 홍합그라탕 회냉면 회덮밥`.split(" ").map(s=>s.replace(/·/g," "));

const state={
  tab:"menu",current:null,last:{menu:null,place:null},
  user:null,isGoogle:false,isAdmin:false,
  mine:{added:[],hidden:[]},             // 내 메뉴판: 추가한 메뉴, 숨긴 기본 메뉴
  places:[],placeAccess:"locked",       // locked | loading | open
  hasDefault:null,confirming:null
};
const $=id=>document.getElementById(id);
const ko=(a,b)=>a.localeCompare(b,"ko");
function menus(){
  if(!state.isGoogle)return DEFAULT_MENUS;
  const hidden=new Set(state.mine.hidden);
  const base=DEFAULT_MENUS.filter(m=>!hidden.has(m));
  const extra=state.mine.added.filter(m=>!base.includes(m));
  return [...base,...extra].sort(ko);
}
const places=()=>state.places;
function todayKST(){const d=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",weekday:"short"}).format(new Date());return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(d)}
function linkOf(p){return p.url||mapLink(p.name)}
function mapLink(name){const q=/위례/.test(name)?name:name+" 위례";return "https://map.kakao.com/link/search/"+encodeURIComponent(q)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let toastT;function toast(msg){$("toast").textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>$("toast").textContent="",2600)}

// ---- tabs & plate ----
function setTab(t){
  state.tab=t;state.current=null;state.confirming=null;
  for(const b of document.querySelectorAll(".tabs button"))b.setAttribute("aria-selected",String(b.dataset.tab===t));
  $("menuSec").hidden=t!=="menu";$("placeSec").hidden=t!=="place";
  $("plateLabel").textContent=t==="menu"?"오늘의 메뉴는":"오늘 갈 곳은";
  renderAll();
  try{localStorage.setItem("tab",t)}catch(e){}
}
function draw(){
  const t=state.tab;let pool;
  if(t==="menu")pool=menus();
  else{if(state.placeAccess!=="open")return;const d=todayKST();pool=places().filter(p=>p.off!==d)}
  if(!pool.length){state.current=null;renderPlate("목록이 비어 있어요");return}
  let pick;const last=state.last[t];
  for(let i=0;i<8;i++){pick=pool[Math.floor(Math.random()*pool.length)];if(pool.length<2||(t==="menu"?pick!==last:pick.name!==last?.name))break}
  state.last[t]=pick;state.current=pick;renderPlate();
  const el=$("pick");el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
}
function renderPlate(emptyMsg){
  $("plate").hidden=state.tab==="place"&&state.placeAccess!=="open";
  const el=$("pick"),meta=$("meta"),c=state.current;
  $("copy").disabled=!c;
  if(!c){el.className="pick idle";el.textContent=emptyMsg||"버튼을 눌러 뽑아보세요";meta.innerHTML="";$("draw").textContent="🍽️ 뽑기";return}
  el.className="pick";$("draw").textContent="🍽️ 다시 뽑기";
  if(state.tab==="menu"){el.textContent=c;meta.innerHTML="";return}
  el.textContent=c.name;
  meta.innerHTML=`<div>${c.cat?`<span class="chip">${esc(c.cat)}</span> `:""}${c.dist?`걸어서 ${c.dist}m`:""}</div>
    <div>${esc(c.addr||"")}</div>
    <div><a href="${esc(linkOf(c))}" target="_blank" rel="noopener">카카오맵에서 보기 ↗</a></div>`;
}
function renderOffNote(){
  const n=$("offNote");if(state.tab!=="place"||state.placeAccess!=="open"){n.hidden=true;return}
  const d=todayKST(),off=places().filter(p=>p.off===d);
  n.hidden=!off.length;n.textContent=`오늘(${DAYS[d]}) 휴무라 빠진 곳: ${off.map(p=>p.name).join(", ")}`;
}
async function copyPick(){
  const c=state.current;if(!c)return;
  const text=state.tab==="menu"?`🍽️ 오늘 점심 메뉴: ${c}`:`🍽️ 오늘 점심은 ${c.name}!${c.cat?` (${c.cat})`:""}\n📍 ${c.addr||""}\n${linkOf(c)}`;
  try{await navigator.clipboard.writeText(text);toast("복사됐어요")}
  catch(e){const r=document.createRange();r.selectNodeContents($("plate"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("복사가 막혀 있어서 선택만 해뒀어요. 길게 눌러 복사하세요")}
}

// ---- account bar ----
function renderAcct(){
  const bar=$("acctBar");
  if(!state.auth){bar.innerHTML="";return}
  if(state.isGoogle){bar.innerHTML=`<span class="who">${esc(state.user.email||"구글 계정")}</span><button class="linkbtn" data-logout>로그아웃</button>`;return}
  bar.innerHTML=`<span class="who">로그인하면 나만의 메뉴판을 쓸 수 있어요</span><button class="btn small" data-login>구글 로그인</button>`;
}

// ---- menu tab ----
function renderMenus(){
  const all=menus(),q=$("menuFilter").value.trim(),edit=state.isGoogle;
  const shown=q?all.filter(m=>m.includes(q)):all;
  $("menuCount").textContent=`${all.length}개 · ${edit?"내 메뉴판":"기본 메뉴판"}`;
  $("menuNote").innerHTML=edit?"내가 추가하거나 지운 메뉴는 나에게만 적용돼요.":`메뉴를 추가하거나 지우려면 <button class="linkbtn" data-login>구글 로그인</button>을 해주세요.`;
  $("menuForm").hidden=!edit;
  $("menuList").innerHTML=shown.length?shown.map(m=>`<li>${esc(m)}${edit?`<button class="x" data-del-menu="${esc(m)}" aria-label="${esc(m)} 삭제">×</button>`:""}</li>`).join(""):`<li class="empty" style="border:0;background:none">${q?"찾는 메뉴가 없어요":"메뉴가 비어 있어요. 위에서 추가해보세요"}</li>`;
  const box=$("menuReset");
  if(!edit){box.innerHTML="";return}
  const changed=state.mine.added.length||state.mine.hidden.length;
  box.innerHTML=state.confirming==="menu"
    ?`<div class="confirm">내 메뉴판을 기본 메뉴판으로 되돌릴까요? 내가 추가·삭제한 내용이 모두 사라져요.<button class="btn small danger" data-yes="menu">되돌리기</button><button class="btn small" data-no>취소</button></div>`
    :`<button class="btn small" data-ask="menu" ${changed?"":"disabled"}>내 메뉴판 초기화</button>`;
}
function addMenu(v){
  const m=state.mine;
  if(m.hidden.includes(v)){saveMine({added:m.added,hidden:m.hidden.filter(x=>x!==v)});toast(`'${v}' 다시 넣었어요`);return}
  if(menus().includes(v)){toast("이미 있는 메뉴예요");return}
  saveMine({added:[...m.added,v],hidden:m.hidden});toast(`'${v}' 추가했어요`);
}
function removeMenu(v){
  const m=state.mine;
  if(m.added.includes(v))saveMine({added:m.added.filter(x=>x!==v),hidden:m.hidden});
  else saveMine({added:m.added,hidden:[...m.hidden,v]});
  toast(`'${v}' 뺐어요`);
}

// ---- place tab ----
function renderPlaces(){
  const open=state.placeAccess==="open";
  $("placeLock").hidden=open||state.placeAccess==="loading";
  $("placeBody").hidden=!open;
  if(!open){renderTools();return}
  const all=[...places()].sort((a,b)=>(a.dist??9999)-(b.dist??9999)),q=$("placeFilter").value.trim(),d=todayKST();
  const shown=q?all.filter(p=>(p.name+" "+(p.cat||"")).includes(q)):all;
  $("placeCount").textContent=`${all.length}곳`;
  $("placeList").innerHTML=shown.length?shown.map(p=>{
    const off=p.off!=null&&p.off!=="";const isOff=off&&p.off===d;
    return `<li class="${isOff?"off":""}"><span class="pname"><a href="${esc(linkOf(p))}" target="_blank" rel="noopener">${esc(p.name)}</a></span>
    <span class="pinfo">${[p.cat,p.dist?p.dist+"m":"",off?DAYS[p.off]+"요일 휴무"+(isOff?" (오늘)":""):"",p.addr].filter(Boolean).map(esc).join(" · ")}</span>
    <button class="x" data-del-place="${esc(p.name)}" aria-label="${esc(p.name)} 삭제">×</button></li>`}).join(""):`<li class="empty">${q?"찾는 가게가 없어요":"가게가 비어 있어요. 위에서 추가해보세요"}</li>`;
  renderTools();
}
// 관리자 도구: 관리자 계정일 때만 화면에 만들어짐
function renderTools(){
  const box=$("adminTools");
  if(!state.isAdmin||state.placeAccess!=="open"){box.innerHTML="";return}
  const c=state.confirming;
  let html=`<div class="tools">`;
  if(c==="place")html+=`<div class="confirm">맛집 목록을 기본 목록으로 되돌릴까요? 추가·삭제한 내용이 모두 사라져요.<button class="btn small danger" data-yes="place">되돌리기</button><button class="btn small" data-no>취소</button></div>`;
  else if(c==="setdefault")html+=`<div class="confirm">지금 맛집 목록(${places().length}곳)을 기본 목록으로 저장할까요? 초기화하면 이 목록으로 돌아가요.<button class="btn small danger" data-yes="setdefault">저장</button><button class="btn small" data-no>취소</button></div>`;
  else html+=`<div class="row"><button class="btn small" data-ask="place" ${state.hasDefault?"":"disabled"}>맛집 초기화</button><button class="btn small" data-ask="setdefault">지금 목록을 기본 목록으로 저장</button></div>`;
  if(state.hasDefault===false)html+=`<label for="importFile">기본 맛집 목록이 아직 없어요. 목록 파일(JSON)을 골라 등록하세요.</label><input id="importFile" type="file" accept=".json,application/json">`;
  box.innerHTML=html+`</div>`;
}

function renderAll(){
  renderMenus();renderPlaces();renderPlate();renderOffNote();
  const n=$("syncNote");
  if(state.tab==="place"&&state.placeAccess==="open")n.textContent="맛집 목록은 회사 사람들이 함께 고쳐요. 누가 고치면 바로 반영돼요.";
  else n.textContent="";
}

const cleanStrs=v=>Array.isArray(v)?v.filter(m=>typeof m==="string"&&m.trim()):[];
const cleanPlaces=v=>Array.isArray(v)?v.filter(p=>p&&typeof p.name==="string"&&p.name.trim()):[];
let db,auth,unsubMine=null,unsubPlaces=null;
const queue={};
function enqueue(k,fn){queue[k]=(queue[k]||Promise.resolve()).then(fn)}

function saveMine(next){
  state.mine=next;renderAll();
  const uid=state.user?.uid;if(!uid)return;
  enqueue("mine",()=>setDoc(doc(db,"users",uid),next).catch(()=>toast("저장하지 못했어요. 잠시 후 다시 해보세요")));
}
function savePlaces(items){
  state.places=items;renderAll();
  enqueue("places",()=>setDoc(doc(db,"places","current"),{items}).catch(e=>toast(e?.code==="permission-denied"?"저장이 거부됐어요. 다시 비밀번호를 입력해주세요":"저장하지 못했어요. 잠시 후 다시 해보세요")));
}

async function handleUser(u){
  state.user=u;
  state.isGoogle=!!u&&u.providerData.some(p=>p.providerId==="google.com");
  state.isAdmin=false;state.hasDefault=null;state.confirming=null;
  unsubMine?.();unsubMine=null;state.mine={added:[],hidden:[]};
  if(state.isGoogle){
    unsubMine=onSnapshot(doc(db,"users",u.uid),s=>{const d=s.exists()?s.data():{};state.mine={added:cleanStrs(d.added),hidden:cleanStrs(d.hidden)};renderAll()},()=>{});
    try{await getDoc(doc(db,"admin","probe"));state.isAdmin=true}catch(e){state.isAdmin=false}
  }
  renderAcct();connectPlaces();
}
function connectPlaces(){
  unsubPlaces?.();unsubPlaces=null;
  if(!state.user){state.placeAccess="locked";state.places=[];renderAll();return}
  state.placeAccess="loading";renderAll();
  unsubPlaces=onSnapshot(doc(db,"places","current"),
    s=>{state.placeAccess="open";state.places=s.exists()?cleanPlaces(s.data().items):[];renderAll()},
    ()=>{state.placeAccess="locked";state.places=[];renderAll()});
  if(state.isAdmin)getDoc(doc(db,"places","default")).then(s=>{state.hasDefault=s.exists();renderAll()}).catch(()=>{});
}

async function submitPassword(pw){
  const msg=$("pwMsg");if(!pw){msg.textContent="비밀번호를 입력해주세요.";return}
  msg.textContent="";
  try{
    if(!auth.currentUser)await signInAnonymously(auth);
    await setDoc(doc(db,"members",auth.currentUser.uid),{pw});
    $("pwInput").value="";connectPlaces();toast("확인됐어요");
  }catch(e){
    msg.textContent=e?.code==="permission-denied"?"비밀번호가 맞지 않아요.":"지금은 확인할 수 없어요. 잠시 후 다시 해주세요.";
  }
}
async function login(){
  const provider=new GoogleAuthProvider();
  try{
    const u=auth.currentUser;
    if(u&&u.isAnonymous){
      // 비밀번호로 들어온 이 기기 계정에 구글 계정을 이어 붙여서, 맛집 권한을 그대로 유지
      try{await linkWithPopup(u,provider);await u.getIdToken(true);await handleUser(auth.currentUser)}
      catch(e){
        if(e?.code!=="auth/credential-already-in-use")throw e;
        const cred=GoogleAuthProvider.credentialFromError(e);
        if(cred)await signInWithCredential(auth,cred);else throw e;
      }
    }else await signInWithPopup(auth,provider);
  }catch(e){
    if(e?.code!=="auth/popup-closed-by-user"&&e?.code!=="auth/cancelled-popup-request")toast("로그인하지 못했어요. 팝업 차단을 확인해주세요");
  }
}

async function resetPlaces(){
  try{
    const s=await getDoc(doc(db,"places","default"));
    if(!s.exists()){toast("기본 맛집 목록이 아직 없어요");return}
    savePlaces(cleanPlaces(s.data().items));toast("기본 목록으로 되돌렸어요");
  }catch(e){toast("되돌리지 못했어요")}
}
async function saveAsDefault(){
  try{await setDoc(doc(db,"places","default"),{items:places()});state.hasDefault=true;renderAll();toast("기본 목록으로 저장했어요")}
  catch(e){toast("저장하지 못했어요")}
}
async function importDefault(file){
  try{
    const items=cleanPlaces(JSON.parse(await file.text())).map(p=>{
      const o={name:String(p.name).trim(),cat:String(p.cat||""),addr:String(p.addr||""),dist:Number.isFinite(p.dist)?p.dist:null,off:Number.isInteger(p.off)?p.off:null};
      if(p.url)o.url=String(p.url);return o;
    });
    if(!items.length){toast("파일에 가게가 없어요");return}
    await setDoc(doc(db,"places","default"),{items});
    state.hasDefault=true;
    if(!places().length)savePlaces(items);else renderAll();
    toast(`기본 목록 ${items.length}곳을 등록했어요`);
  }catch(e){toast("파일을 읽지 못했어요. JSON 파일인지 확인해주세요")}
}

function initFirebase(){
  try{
    const app=initializeApp(firebaseConfig);
    db=getFirestore(app);auth=getAuth(app);state.auth=auth;
    onAuthStateChanged(auth,u=>{handleUser(u)});
  }catch(e){$("syncNote").textContent="저장소에 연결하지 못했어요. 새로고침해 주세요."}
}

// ---- place search (Kakao Local) ----
const OFFICE_ADDR="경기 성남시 수정구 위례서일로 6";
const kk={places:null,center:null};
const ALLOWED_AREA=/성남시\s*수정구\s*창곡동/;
const inArea=d=>ALLOWED_AREA.test(d.address_name||"");
function initKakao(){
  const k=window.kakao;
  if(!k||!k.maps||!k.maps.load){$("placeHint").textContent="지금은 가게 검색에 연결되지 않아서 가게를 추가할 수 없어요.";return}
  k.maps.load(()=>{
    kk.places=new k.maps.services.Places();
    new k.maps.services.Geocoder().addressSearch(OFFICE_ADDR,(r,st)=>{if(st===k.maps.services.Status.OK&&r[0])kk.center=new k.maps.LatLng(r[0].y,r[0].x)});
    $("placeSearch").disabled=false;
  });
}
function hideResults(){$("placeResults").hidden=true;$("placeResults").innerHTML=""}
function catOf(c){const parts=String(c||"").split(">").map(x=>x.trim()).filter(Boolean);return parts.length>1?parts.slice(1).join(" · "):(parts[0]||"")}
let lastResults=[];
function searchPlace(){
  const q=$("placeName").value.trim(),box=$("placeResults");
  if(!q||!kk.places||state.placeAccess!=="open")return;
  box.hidden=false;box.innerHTML=`<li class="rmsg">찾는 중…</li>`;
  const k=window.kakao,S=k.maps.services;
  const opt={size:8};
  if(kk.center){opt.location=kk.center;opt.radius=3000;opt.sort=S.SortBy.DISTANCE}
  kk.places.keywordSearch(q,(data,status)=>{
    if(status===S.Status.ZERO_RESULT){box.innerHTML=`<li class="rmsg">창곡동에서 그 가게를 찾지 못했어요. 이름을 다시 확인해주세요.</li>`;return}
    if(status!==S.Status.OK){box.innerHTML=`<li class="rmsg">검색이 안 돼요. 잠시 후 다시 해주세요.</li>`;return}
    data=data.filter(inArea);
    if(!data.length){box.innerHTML=`<li class="rmsg">창곡동에 있는 가게만 추가할 수 있어요. 검색 결과가 모두 다른 동네예요.</li>`;return}
    lastResults=data;
    box.innerHTML=data.map((d,i)=>`<li><button type="button" data-pick="${i}"><span class="rn">${esc(d.place_name)}</span><span class="rd">${d.distance?Number(d.distance).toLocaleString()+"m":""}</span><span class="ra">${esc(catOf(d.category_name))}${d.category_name?" · ":""}${esc(d.road_address_name||d.address_name||"")}</span></button></li>`).join("");
  },opt);
}
function pickResult(i){
  const d=lastResults[i];if(!d)return;
  if(!inArea(d)){toast("창곡동에 있는 가게만 추가할 수 있어요");return}
  const name=d.place_name;
  if(places().some(p=>p.name===name||(d.place_url&&p.url===d.place_url))){toast("이미 있는 가게예요");return}
  const item={name,cat:catOf(d.category_name),addr:d.road_address_name||d.address_name||"",dist:d.distance?Number(d.distance):null,off:null};
  if(d.place_url)item.url=d.place_url;
  savePlaces([...places(),item]);
  $("placeName").value="";hideResults();toast(`'${name}' 추가했어요`);
}

document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(t)setTab(t.dataset.tab)});
$("draw").addEventListener("click",draw);

$("placeSearch").addEventListener("click",searchPlace);
$("placeResults").addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b)pickResult(Number(b.dataset.pick))});
$("pwForm").addEventListener("submit",e=>{e.preventDefault();submitPassword($("pwInput").value)});
document.addEventListener("change",e=>{if(e.target.id==="importFile"&&e.target.files[0]&&state.isAdmin)importDefault(e.target.files[0])});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.hasAttribute("data-login")){login();return}
  if(t.hasAttribute("data-logout")){signOut(auth).then(()=>toast("로그아웃했어요"));return}
  if(t.dataset.delMenu!=null){removeMenu(t.dataset.delMenu);return}
  if(t.dataset.delPlace!=null){const v=t.dataset.delPlace;savePlaces(places().filter(p=>p.name!==v));if(state.current?.name===v){state.current=null;renderPlate()}toast(`'${v}' 뺐어요`);return}
  if(t.dataset.ask){if(t.dataset.ask!=="menu"&&!state.isAdmin)return;state.confirming=t.dataset.ask;renderAll();return}
  if(t.hasAttribute("data-no")){state.confirming=null;renderAll();return}
  if(t.dataset.yes){
    const k=t.dataset.yes;state.confirming=null;
    if(k==="menu"){saveMine({added:[],hidden:[]});toast("기본 메뉴판으로 되돌렸어요")}
    else if(k==="place"&&state.isAdmin)resetPlaces();
    else if(k==="setdefault"&&state.isAdmin)saveAsDefault();
    else renderAll();
  }
});

let startTab="menu";try{const t=localStorage.getItem("tab");if(t==="place")startTab=t}catch(e){}
setTab(startTab);initFirebase();initKakao();
</script>
